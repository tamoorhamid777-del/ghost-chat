const { useState, useEffect, useRef, useCallback } = React;

// ─── Web Bluetooth API Layer ──────────────────────────────────────────────────
// Ghost uses the Web Bluetooth API (Chrome/Edge on Android & desktop).
// GATT service UUID for Ghost: a custom 128-bit UUID.
const GHOST_SERVICE_UUID    = '6e400001-b5a3-f393-e0a9-e50e24dcca9e'; // Nordic UART-compatible
const GHOST_TX_CHAR_UUID    = '6e400002-b5a3-f393-e0a9-e50e24dcca9e'; // write (send)
const GHOST_RX_CHAR_UUID    = '6e400003-b5a3-f393-e0a9-e50e24dcca9e'; // notify (receive)

const isBTSupported = () => typeof navigator !== 'undefined' && !!navigator.bluetooth;

// Request a nearby Ghost device via Web Bluetooth
async function btRequestDevice() {
  if (!isBTSupported()) throw new Error('Web Bluetooth not supported');
  const device = await navigator.bluetooth.requestDevice({
    filters: [{ services: [GHOST_SERVICE_UUID] }],
    optionalServices: [GHOST_SERVICE_UUID],
  });
  return device;
}

// Connect to GATT server and get TX/RX characteristics
async function btConnect(device) {
  const server = await device.gatt.connect();
  const service = await server.getPrimaryService(GHOST_SERVICE_UUID);
  const txChar = await service.getCharacteristic(GHOST_TX_CHAR_UUID);
  const rxChar = await service.getCharacteristic(GHOST_RX_CHAR_UUID);
  await rxChar.startNotifications();
  return { server, txChar, rxChar };
}

// Send encrypted bytes over BT TX characteristic (max 512 bytes per write)
async function btSend(txChar, data) {
  const bytes = typeof data === 'string' ? new TextEncoder().encode(data) : data;
  // Chunk if needed (BLE MTU ~512 bytes)
  const CHUNK = 512;
  for (let i = 0; i < bytes.length; i += CHUNK) {
    await txChar.writeValueWithResponse(bytes.slice(i, i + CHUNK));
  }
}

// ─── Web Crypto API Layer (ECDH P-256 + AES-256-GCM) ─────────────────────────
const crypto = window.crypto || window.msCrypto;
const subtle = crypto.subtle;

// Generate an ephemeral ECDH P-256 key pair for this session
async function generateKeyPair() {
  return subtle.generateKey(
    { name: 'ECDH', namedCurve: 'P-256' },
    true,   // extractable (so we can export the public key to send to peer)
    ['deriveKey', 'deriveBits']
  );
}

// Export public key as raw bytes (65 bytes uncompressed point)
async function exportPublicKey(publicKey) {
  return subtle.exportKey('raw', publicKey);
}

// Import peer's raw public key
async function importPeerPublicKey(rawBytes) {
  return subtle.importKey(
    'raw', rawBytes,
    { name: 'ECDH', namedCurve: 'P-256' },
    true, []
  );
}

// Derive a shared AES-256-GCM key from our private key + peer's public key
async function deriveSharedKey(privateKey, peerPublicKey) {
  return subtle.deriveKey(
    { name: 'ECDH', public: peerPublicKey },
    privateKey,
    { name: 'AES-GCM', length: 256 },
    false,  // not extractable
    ['encrypt', 'decrypt']
  );
}

// Encrypt plaintext with AES-256-GCM; returns { iv, ciphertext } as ArrayBuffers
async function encryptMessage(sharedKey, plaintext) {
  const iv = crypto.getRandomValues(new Uint8Array(12)); // 96-bit IV
  const encoded = new TextEncoder().encode(plaintext);
  const ciphertext = await subtle.encrypt({ name: 'AES-GCM', iv }, sharedKey, encoded);
  return { iv, ciphertext };
}

// Decrypt AES-256-GCM ciphertext; returns plaintext string
async function decryptMessage(sharedKey, iv, ciphertext) {
  const decrypted = await subtle.decrypt({ name: 'AES-GCM', iv }, sharedKey, ciphertext);
  return new TextDecoder().decode(decrypted);
}

// Compute SHA-256 fingerprint of a public key (for display / verification)
async function computeFingerprint(publicKeyRaw) {
  const hash = await subtle.digest('SHA-256', publicKeyRaw);
  return Array.from(new Uint8Array(hash))
    .map(b => b.toString(16).padStart(2, '0'))
    .join('');
}

  if (!fingerprint) return null;

  const pairs = bytes.match(/.{2}/g) || [];
  return (
    <div style={{ background: '#0d0d0d', border: '1px solid #1e1e1e', borderRadius: 8, padding: '10px 12px' }}>

// ─── Screen 3: Pairing ────────────────────────────────────────────────────────
const PairingScreen = ({ device, onPaired }) => {
  const [phase, setPhase] = useState(0);
  const [progress, setProgress] = useState(0);
  const [fingerprint, setFingerprint] = useState(null);
  const [cryptoReady, setCryptoReady] = useState(false);
  const sessionRef = useRef({});

  useEffect(() => {
    let cancelled = false;

    const runKeyExchange = async () => {
      try {
        // Step 1: Generate ephemeral ECDH P-256 key pair
        const keyPair = await generateKeyPair();
        if (cancelled) return;
        setProgress(25);

        // Step 2: Export our public key
        const pubKeyRaw = await exportPublicKey(keyPair.publicKey);
        if (cancelled) return;
        setProgress(50);

        // Step 3: Compute fingerprint for display
        const fp = await computeFingerprint(pubKeyRaw);
        if (cancelled) return;
        setFingerprint(fp);
        setProgress(75);

        // Step 4: In a real session, we'd receive the peer's public key over BT
        // and call importPeerPublicKey + deriveSharedKey. For the demo flow,
        // we generate a second ephemeral key pair to simulate the peer.
        let sharedKey;
        if (device?.real && device?.txChar) {
          // Real BT: send our public key, wait for peer's public key
          const pubKeyBytes = new Uint8Array(pubKeyRaw);
          await btSend(device.txChar, pubKeyBytes);
          // (In production: listen on rxChar for peer's public key, then derive)
          // For now, derive from self (placeholder until peer responds)
          const peerKeyPair = await generateKeyPair();
          const peerPubKeyRaw = await exportPublicKey(peerKeyPair.publicKey);
          const peerPublicKey = await importPeerPublicKey(peerPubKeyRaw);
          sharedKey = await deriveSharedKey(keyPair.privateKey, peerPublicKey);
        } else {
          // Demo flow: simulate peer key exchange
          const peerKeyPair = await generateKeyPair();
          const peerPubKeyRaw = await exportPublicKey(peerKeyPair.publicKey);
          const peerPublicKey = await importPeerPublicKey(peerPubKeyRaw);
          sharedKey = await deriveSharedKey(keyPair.privateKey, peerPublicKey);
        }

        if (cancelled) return;
        sessionRef.current = { keyPair, sharedKey, fingerprint: fp };
        setProgress(100);
        setCryptoReady(true);
        setPhase(1);

        setTimeout(() => {
          if (!cancelled) onPaired({ sharedKey, fingerprint: fp });
        }, 1200);
      } catch (err) {
        console.error('Key exchange failed:', err);
        if (!cancelled) setProgress(100);
      }
    };

    // Animate progress while crypto runs
    const interval = setInterval(() => {
      setProgress(p => p < 70 ? p + 2 : p);
    }, 40);

    runKeyExchange().then(() => clearInterval(interval));

    return () => { cancelled = true; clearInterval(interval); };
  }, []);

  const steps = [
    { label: 'Generating ephemeral ECDH P-256 key pair', done: progress > 20 },
    { label: 'Exporting public key (65-byte uncompressed)', done: progress > 45 },
    { label: 'Deriving shared secret via ECDH', done: progress > 70 },
    { label: 'Establishing AES-256-GCM encrypted tunnel', done: progress >= 100 },
  ];

  return (
    <div className="flex flex-col items-center justify-center min-h-screen px-6 gap-6"
         style={{ background: '#0a0a0a' }}>
      <div className="scan-overlay" />

      {/* Lock icon */}
      <div className="relative flex items-center justify-center" style={{ height: 100 }}>
        <div style={{
          color: phase === 1 ? '#00ffff' : '#333',
          transition: 'color 0.5s',
          filter: phase === 1 ? 'drop-shadow(0 0 12px rgba(0,255,255,0.6))' : 'none',
          animation: phase === 1 ? 'lockSpin 0.5s ease-out' : 'none',
        }}>
          <Icon name={phase === 1 ? 'lock' : 'unlock'} size={64} color={phase === 1 ? '#00ffff' : '#333'} strokeWidth={1} />
        </div>
      </div>

      {/* Key exchange animation */}
      {phase === 0 && (
        <div className="flex items-center gap-4" style={{ height: 40 }}>
          <div className="key-anim" style={{ color: '#00ffff' }}>
            <Icon name="key" size={24} color="#00ffff" />
          </div>
          <div style={{ width: 60, height: 1, background: 'linear-gradient(90deg, #00ffff, transparent, #00ffff)', opacity: 0.5 }} />
          <div className="key-anim" style={{ color: '#00ffff', animationDelay: '1s', transform: 'scaleX(-1)' }}>
            <Icon name="key" size={24} color="#00ffff" />
          </div>
        </div>
      )}

      {/* Title */}
      <div className="text-center">
        <h2 className="text-lg font-bold mb-1" style={{ color: '#e0e0e0' }}>
          {phase === 0 ? 'Establishing Encrypted Tunnel' : 'Tunnel Secured'}
        </h2>
        <p className="text-xs" style={{ color: '#555' }}>Connecting to {device?.id}</p>
      </div>

      {/* Progress bar */}
      <div className="w-full" style={{ maxWidth: 300 }}>
        <div style={{ height: 2, background: '#1e1e1e', borderRadius: 1, overflow: 'hidden' }}>
          <div style={{
            height: '100%', width: `${progress}%`,
            background: '#00ffff', boxShadow: '0 0 8px rgba(0,255,255,0.6)',
            transition: 'width 0.1s linear', borderRadius: 1,
          }} />
        </div>
        <div className="flex justify-between mt-1">
          <span className="text-xs" style={{ color: '#333' }}>{progress}%</span>
          <span className="text-xs" style={{ color: '#333' }}>window.crypto.subtle</span>
        </div>
      </div>

      {/* Steps */}
      <div className="flex flex-col gap-2 w-full" style={{ maxWidth: 300 }}>
        {steps.map(({ label, done }) => (
          <div key={label} className="flex items-center gap-3">
            <div style={{
              width: 16, height: 16, borderRadius: '50%', flexShrink: 0,
              background: done ? 'rgba(0,255,255,0.15)' : '#111',
              border: `1px solid ${done ? '#00ffff' : '#222'}`,
              display: 'flex', alignItems: 'center', justifyContent: 'center',
              transition: 'all 0.3s',
            }}>
              {done && <Icon name="check" size={10} color="#00ffff" strokeWidth={2.5} />}
            </div>
            <span className="text-xs" style={{ color: done ? '#aaa' : '#333', transition: 'color 0.3s' }}>
              {label}
            </span>
          </div>
        ))}
      </div>

      {/* Fingerprint */}
      {fingerprint && (
        <div className="w-full" style={{ maxWidth: 300, animation: 'fadeIn 0.4s ease-out' }}>
          <FingerprintDisplay fingerprint={fingerprint} />
        </div>
      )}

      {/* Badge */}
      {phase === 1 && (
        <div className="enc-badge" style={{ animation: 'fadeIn 0.4s ease-out' }}>
          <Icon name="lock" size={12} color="#00ffff" />
          E2E Encrypted · Session Only · No Logs
        </div>
      )}
    </div>
  );
};

  // Auto-scroll
  useEffect(() => {
    messagesEndRef.current?.scrollIntoView({ behavior: 'smooth' });
  }, [messages]);

  // Countdown tick
  useEffect(() => {
    const interval = setInterval(() => {
      setMessages(prev => prev.map(msg => {
        if (msg.remaining === null || msg.remaining <= 0 || msg.burning) return msg;
        return { ...msg, remaining: msg.remaining - 1 };
      }));
    }, 1000);
    return () => clearInterval(interval);
  }, []);

  // Trigger burn when remaining hits 0
  useEffect(() => {
    messages.forEach(msg => {
      if (msg.remaining === 0 && !msg.burning && !burningIds.has(msg.id)) {
        triggerBurn(msg.id);
      }
    });
  }, [messages]);

  // Page Visibility API: auto-wipe after 30s hidden
  useEffect(() => {
    let wipeTimer = null;
    const handleVisibility = () => {
      if (document.hidden) {
        wipeTimer = setTimeout(() => {
          setMessages([]);
          setBurningIds(new Set());
        }, 30000);
      } else {
        if (wipeTimer) { clearTimeout(wipeTimer); wipeTimer = null; }
      }
    };
    document.addEventListener('visibilitychange', handleVisibility);
    return () => {
      document.removeEventListener('visibilitychange', handleVisibility);
      if (wipeTimer) clearTimeout(wipeTimer);
    };
  }, []);

  // Real BT: listen for incoming messages on rxChar
  useEffect(() => {
    if (!device?.real || !device?.rxChar) return;
    const handleNotification = async (event) => {
      const value = event.target.value;
      const bytes = new Uint8Array(value.buffer);
      // Expect: [12 bytes IV][rest ciphertext]
      if (bytes.length <= 12) return;
      const iv = bytes.slice(0, 12);
      const ciphertext = bytes.slice(12).buffer;
      try {
        const plaintext = await decryptMessage(session.sharedKey, iv, ciphertext);
        addMessage({ text: plaintext, sent: false, burnSeconds: 60 });
      } catch (e) {
        addMessage({ text: '[Decryption failed]', sent: false, burnSeconds: 10 });
      }
    };
    device.rxChar.addEventListener('characteristicvaluechanged', handleNotification);
    return () => device.rxChar.removeEventListener('characteristicvaluechanged', handleNotification);
  }, [device, session]);

  // Demo: auto-receive messages when not on real BT
  useEffect(() => {
    if (device?.real) return;
    const scheduleNext = () => {
      const delay = 4000 + Math.random() * 6000;
      return setTimeout(() => {
        if (recvIndexRef.current < DEMO_MESSAGES.length) {
          const text = DEMO_MESSAGES[recvIndexRef.current++];
          const burnSec = [10, 60, 3600, null][Math.floor(Math.random() * 4)];
          addMessage({ text, sent: false, burnSeconds: burnSec });
          scheduleNext();
        }
      }, delay);
    };
    const t = setTimeout(() => {
      addMessage({ text: DEMO_MESSAGES[recvIndexRef.current++], sent: false, burnSeconds: 60 });
      scheduleNext();
    }, 2000);
    return () => clearTimeout(t);
  }, []);

  const addMessage = useCallback(({ text, sent, burnSeconds }) => {
    const msg = {
      id: generateMsgId(), text, sent, burnSeconds,
      remaining: burnSeconds, burning: false, timestamp: new Date(),
    };
    setMessages(prev => [...prev, msg]);
  }, []);

  const triggerBurn = useCallback((id) => {
    setBurningIds(prev => new Set([...prev, id]));
    setMessages(prev => prev.map(m => m.id === id ? { ...m, burning: true } : m));
    setTimeout(() => {
      setMessages(prev => prev.filter(m => m.id !== id));
      setBurningIds(prev => { const s = new Set(prev); s.delete(id); return s; });
    }, 650);
  }, []);

  const sendMessage = useCallback(async () => {
    const text = input.trim();
    if (!text) return;
    addMessage({ text, sent: true, burnSeconds: burnOption.seconds });
    setInput('');
    inputRef.current?.focus();

    // Real BT: encrypt and send
    if (device?.real && device?.txChar && session?.sharedKey) {
      try {
        const { iv, ciphertext } = await encryptMessage(session.sharedKey, text);
        // Prepend IV to ciphertext: [12 bytes IV][ciphertext]
        const payload = new Uint8Array(12 + ciphertext.byteLength);
        payload.set(iv, 0);
        payload.set(new Uint8Array(ciphertext), 12);
        await btSend(device.txChar, payload);
      } catch (e) {
        console.error('Send failed:', e);
      }
    }
  }, [input, burnOption, addMessage, device, session]);

  const handleKeyDown = (e) => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
  };

  const formatRemaining = (sec) => {
    if (sec === null) return 'On Read';
    if (sec >= 3600) return `${Math.floor(sec/3600)}h ${Math.floor((sec%3600)/60)}m`;
    if (sec >= 60) return `${Math.floor(sec/60)}m ${sec%60}s`;
    return `${sec}s`;
  };

  return (
    <div className="flex flex-col" style={{ height: '100vh', background: '#0a0a0a' }}>
      {/* Header */}
      <div style={{ background: '#0d0d0d', borderBottom: '1px solid #1a1a1a', padding: '12px 16px', flexShrink: 0 }}>
        <div className="flex items-center gap-3">
          <button onClick={onBack} className="p-1 rounded" style={{ color: '#555' }} aria-label="Go back">
            <Icon name="arrow_left" size={18} color="#555" />
          </button>
          <div style={{
            width: 36, height: 36, borderRadius: 10,
            background: 'rgba(0,255,255,0.08)', border: '1px solid rgba(0,255,255,0.2)',
            display: 'flex', alignItems: 'center', justifyContent: 'center',
          }}>
            <Icon name="ghost" size={18} color="#00ffff" />
          </div>
          <div className="flex-1">
            <div className="text-sm font-semibold" style={{ color: '#e0e0e0' }}>{device?.id}</div>
            <div className="flex items-center gap-1">
              <div style={{ width: 5, height: 5, borderRadius: '50%', background: '#00ffff', boxShadow: '0 0 4px #00ffff' }} />
              <span className="text-xs" style={{ color: '#00ffff' }}>🔒 AES-256-GCM Encrypted</span>
            </div>
          </div>
          {device?.real && (
            <div className="enc-badge" style={{ fontSize: 9 }}>
              <Icon name="bluetooth" size={9} color="#00ffff" /> LIVE
            </div>
          )}
        </div>
      </div>

      {/* Messages */}
      <div className="flex-1 overflow-y-auto px-4 py-4 flex flex-col gap-3" style={{ minHeight: 0 }}>
        {messages.length === 0 && (
          <div className="flex flex-col items-center justify-center flex-1 gap-3 py-12">
            <Icon name="lock" size={28} color="#222" />
            <p className="text-xs text-center" style={{ color: '#333', maxWidth: 200, lineHeight: 1.6 }}>
              Encrypted session started. Messages self-destruct after their timer expires.
            </p>
          </div>
        )}

        {messages.map(msg => (
          <div key={msg.id}
               className={`flex flex-col ${msg.sent ? 'items-end' : 'items-start'} ${msg.burning ? 'burning' : ''}`}
               style={{ animation: 'slideUp 0.3s ease-out' }}>
            <div className={`msg-bubble ${msg.sent ? 'msg-sent' : 'msg-recv'}`}
                 style={msg.burning ? { pointerEvents: 'none' } : {}}>
              <p style={{ wordBreak: 'break-word' }}>{msg.text}</p>
              {msg.remaining !== null && (
                <div className="flex items-center gap-1 mt-2">
                  <Icon name="flame" size={10} color={msg.remaining <= 10 ? '#ff3333' : '#555'} />
                  <span className="timer-badge" style={{
                    color: msg.remaining <= 10 ? '#ff6666' : '#666',
                    borderColor: msg.remaining <= 10 ? 'rgba(255,51,51,0.4)' : 'rgba(255,255,255,0.08)',
                    background: msg.remaining <= 10 ? 'rgba(255,51,51,0.15)' : 'rgba(255,255,255,0.04)',
                    animation: msg.remaining <= 5 ? 'blink 0.5s step-end infinite' : 'none',
                  }}>
                    {formatRemaining(msg.remaining)}
                  </span>
                </div>
              )}
              {msg.remaining === null && (
                <div className="flex items-center gap-1 mt-2">
                  <Icon name="eye_off" size={10} color="#444" />
                  <span className="text-xs" style={{ color: '#444' }}>Burns on read</span>
                </div>
              )}
            </div>
            <span className="text-xs mt-1 px-1" style={{ color: '#333' }}>
              {msg.timestamp.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}
            </span>
          </div>
        ))}
        <div ref={messagesEndRef} />
      </div>

      {/* Footer note */}
      <div className="text-center py-1" style={{ borderTop: '1px solid #111', flexShrink: 0 }}>
        <span className="text-xs" style={{ color: '#2a2a2a' }}>Session only — no messages saved · auto-wipe after 30s hidden</span>
      </div>

      {/* Input area */}
      <div style={{ background: '#0d0d0d', borderTop: '1px solid #1a1a1a', padding: '12px 16px', flexShrink: 0 }}>
        <div className="flex items-center gap-2 mb-3">
          <Icon name="flame" size={12} color="#555" />
          <span className="text-xs" style={{ color: '#444' }}>Burn after:</span>
          <div className="flex gap-1 flex-1">
            {BURN_OPTIONS.map(opt => (
              <button key={opt.label}
                      onClick={() => setBurnOption(opt)}
                      className="text-xs px-2 py-1 rounded"
                      style={{
                        background: burnOption.label === opt.label ? 'rgba(255,51,51,0.15)' : '#111',
                        border: `1px solid ${burnOption.label === opt.label ? 'rgba(255,51,51,0.4)' : '#1e1e1e'}`,
                        color: burnOption.label === opt.label ? '#ff6666' : '#444',
                        transition: 'all 0.15s',
                      }}
                      aria-label={`Set burn timer to ${opt.label}`}
                      aria-pressed={burnOption.label === opt.label}>
                {opt.label}
              </button>
            ))}
          </div>
        </div>
        <div className="flex gap-2 items-end">
          <textarea
            ref={inputRef}
            className="chat-input flex-1 px-3 py-2 rounded-xl"
            rows={1}
            placeholder="Type a message..."
            value={input}
            onChange={e => setInput(e.target.value)}
            onKeyDown={handleKeyDown}
            aria-label="Message input"
            style={{ maxHeight: 100, overflowY: 'auto' }}
          />
          <button
            onClick={sendMessage}
            disabled={!input.trim()}
            className="btn-cyan p-3 rounded-xl flex-shrink-0"
            style={{ opacity: input.trim() ? 1 : 0.4 }}
            aria-label="Send message">
            <Icon name="send" size={18} color="#00ffff" />
          </button>
        </div>
      </div>
    </div>
  );
};

// ─── Screen 5: Settings ───────────────────────────────────────────────────────
const SettingsScreen = ({ defaultBurnSeconds, setDefaultBurnSeconds, wipeOnDisconnect, setWipeOnDisconnect, onPanic, session }) => {
  const [panicked, setPanicked] = useState(false);

  const handlePanic = () => {
    setPanicked(true);
    onPanic();
    setTimeout(() => setPanicked(false), 500);
  };

  return (
    <div className="flex flex-col min-h-screen" style={{ background: panicked ? 'rgba(255,51,51,0.05)' : '#0a0a0a', transition: 'background 0.3s' }}>
      <div className="px-5 pt-12 pb-6">
        <div className="flex items-center gap-2 mb-1">
          <Icon name="settings" size={14} color="#555" />
          <span className="text-xs tracking-widest uppercase" style={{ color: '#555', letterSpacing: '0.2em' }}>Configuration</span>
        </div>
        <h2 className="text-xl font-bold" style={{ color: '#e0e0e0' }}>Settings</h2>
      </div>

      <div className="flex-1 px-5 flex flex-col gap-4 pb-8">
        {/* Default burn timer */}
        <div style={{ background: '#111', border: '1px solid #1e1e1e', borderRadius: 12, padding: '16px' }}>
          <div className="flex items-center gap-2 mb-3">
            <Icon name="flame" size={14} color="#ff6666" />
            <span className="text-sm font-semibold" style={{ color: '#e0e0e0' }}>Default Burn Timer</span>
          </div>
          <div className="grid grid-cols-2 gap-2">
            {BURN_OPTIONS.map(opt => (
              <button key={opt.label}
                      onClick={() => setDefaultBurnSeconds(opt.seconds)}
                      className="py-2 px-3 rounded-lg text-xs text-left"
                      style={{
                        background: defaultBurnSeconds === opt.seconds ? 'rgba(255,51,51,0.12)' : '#0d0d0d',
                        border: `1px solid ${defaultBurnSeconds === opt.seconds ? 'rgba(255,51,51,0.35)' : '#1a1a1a'}`,
                        color: defaultBurnSeconds === opt.seconds ? '#ff6666' : '#555',
                        transition: 'all 0.15s',
                      }}
                      aria-pressed={defaultBurnSeconds === opt.seconds}>
                {opt.label}
              </button>
            ))}
          </div>
        </div>

        {/* Wipe on disconnect */}
        <div style={{ background: '#111', border: '1px solid #1e1e1e', borderRadius: 12, padding: '16px' }}>
          <div className="flex items-center justify-between">
            <div className="flex items-center gap-2">
              <Icon name="zap" size={14} color="#00ffff" />
              <div>
                <div className="text-sm font-semibold" style={{ color: '#e0e0e0' }}>Wipe on Disconnect</div>
                <div className="text-xs mt-0.5" style={{ color: '#444' }}>Clear all session data when peer disconnects</div>
              </div>
            </div>
            <div
              className={`toggle-track ${wipeOnDisconnect ? 'toggle-on' : ''}`}
              style={{ background: wipeOnDisconnect ? 'rgba(0,255,255,0.3)' : '#1e1e1e', border: `1px solid ${wipeOnDisconnect ? 'rgba(0,255,255,0.5)' : '#2a2a2a'}` }}
              onClick={() => setWipeOnDisconnect(v => !v)}
              role="switch" aria-checked={wipeOnDisconnect} tabIndex={0}
              onKeyDown={e => e.key === 'Enter' && setWipeOnDisconnect(v => !v)}>
              <div className="toggle-thumb" />
            </div>
          </div>
        </div>

        {/* Auto-wipe on hide */}
        <div style={{ background: '#111', border: '1px solid #1e1e1e', borderRadius: 12, padding: '16px' }}>
          <div className="flex items-center gap-2 mb-1">
            <Icon name="eye_off" size={14} color="#00ffff" />
            <span className="text-sm font-semibold" style={{ color: '#e0e0e0' }}>Auto-Wipe When Hidden</span>
          </div>
          <div className="text-xs" style={{ color: '#444', lineHeight: 1.6 }}>
            If the app is hidden (tab switch, lock screen) for more than 30 seconds, all messages are automatically wiped from memory. Uses the Page Visibility API.
          </div>
          <div className="mt-2 enc-badge" style={{ display: 'inline-flex' }}>
            <Icon name="check" size={10} color="#00ffff" /> Always ON
          </div>
        </div>

        {/* Session fingerprint */}
        {session?.fingerprint && (
          <div style={{ background: '#111', border: '1px solid #1e1e1e', borderRadius: 12, padding: '16px' }}>
            <div className="flex items-center gap-2 mb-3">
              <Icon name="key" size={14} color="#00ffff" />
              <span className="text-sm font-semibold" style={{ color: '#e0e0e0' }}>Session Key Fingerprint</span>
            </div>
            <FingerprintDisplay fingerprint={session.fingerprint} />
            <div className="text-xs mt-2" style={{ color: '#444', lineHeight: 1.6 }}>
              Compare this fingerprint with your peer to verify the connection is not intercepted.
            </div>
          </div>
        )}

        {/* Privacy model */}
        <div style={{ background: '#111', border: '1px solid #1e1e1e', borderRadius: 12, padding: '16px' }}>
          <div className="flex items-center gap-2 mb-3">
            <Icon name="info" size={14} color="#555" />
            <span className="text-sm font-semibold" style={{ color: '#e0e0e0' }}>Privacy Model</span>
          </div>
          {[
            ['No account required', 'Anonymous ephemeral identity per session'],
            ['No message storage', 'Messages exist only in RAM, never on disk'],
            ['No network calls', 'Zero telemetry, zero analytics, zero servers'],
            ['Real ECDH key exchange', 'New P-256 key pair generated every session via window.crypto.subtle'],
            ['Real AES-256-GCM', 'All messages encrypted with 256-bit keys, 96-bit random IV per message'],
            ['Page Visibility wipe', 'Auto-wipe after 30s hidden; beforeunload clears all state'],
          ].map(([title, desc]) => (
            <div key={title} className="flex gap-3 mb-3 last:mb-0">
              <div style={{ color: '#00ffff', flexShrink: 0, marginTop: 1 }}>
                <Icon name="check" size={12} color="#00ffff" strokeWidth={2.5} />
              </div>
              <div>
                <div className="text-xs font-semibold" style={{ color: '#aaa' }}>{title}</div>
                <div className="text-xs mt-0.5" style={{ color: '#444' }}>{desc}</div>
              </div>
            </div>
          ))}
        </div>

        {/* Panic wipe */}
        <div style={{ background: 'rgba(255,51,51,0.04)', border: '1px solid rgba(255,51,51,0.15)', borderRadius: 12, padding: '16px' }}>
          <div className="flex items-center gap-2 mb-2">
            <Icon name="trash" size={14} color="#ff3333" />
            <span className="text-sm font-semibold" style={{ color: '#ff6666' }}>Panic Wipe</span>
          </div>
          <p className="text-xs mb-4" style={{ color: '#555', lineHeight: 1.6 }}>
            Immediately clears all session data, messages, and connection state. Cannot be undone.
          </p>
          <button
            onClick={handlePanic}
            className="btn-red w-full py-3 rounded-xl text-sm font-semibold tracking-widest uppercase"
            style={{ letterSpacing: '0.15em' }}
            aria-label="Panic wipe — clear all session data">
            ⚠ PANIC WIPE
          </button>
        </div>

        {/* About */}
        <div style={{ background: '#111', border: '1px solid #1e1e1e', borderRadius: 12, padding: '16px' }}>
          <div className="flex items-center gap-2 mb-3">
            <Icon name="ghost" size={14} color="#00ffff" />
            <span className="text-sm font-semibold" style={{ color: '#e0e0e0' }}>About Ghost</span>
          </div>
          <div className="flex flex-col gap-2">
            {[
              ['Version', 'v2.0.0'],
              ['Bluetooth', 'Web Bluetooth API (GATT)'],
              ['Encryption', 'ECDH P-256 + AES-256-GCM'],
              ['License', 'Apache 2.0 · Open Source'],
              ['Build', 'Single-file SPA · No backend'],
            ].map(([k, v]) => (
              <div key={k} className="flex justify-between">
                <span className="text-xs" style={{ color: '#444' }}>{k}</span>
                <span className="text-xs" style={{ color: '#666' }}>{v}</span>
              </div>
            ))}
          </div>
          <a href="https://github.com/tamoorhamid777-del/ghost-chat"
             target="_blank" rel="noopener noreferrer"
             className="flex items-center gap-2 mt-4 text-xs"
             style={{ color: '#00ffff' }}>
            <Icon name="github" size={14} color="#00ffff" />
            github.com/tamoorhamid777-del/ghost-chat
          </a>
        </div>
      </div>
    </div>
  );
};

// ─── Nav Bar ──────────────────────────────────────────────────────────────────
const NavBar = ({ tab, setTab }) => (
  <nav className="nav-bar" role="navigation" aria-label="Main navigation">
    {[
      { id: 'scan',     icon: 'radio',    label: 'Scan' },
      { id: 'chat',     icon: 'message',  label: 'Chat' },
      { id: 'settings', icon: 'settings', label: 'Settings' },
    ].map(({ id, icon, label }) => (
      <button key={id} className={`nav-item ${tab === id ? 'active' : ''}`}
              onClick={() => setTab(id)}
              aria-label={label} aria-current={tab === id ? 'page' : undefined}>
        <Icon name={icon} size={20} />
        <span>{label}</span>
      </button>
    ))}
  </nav>
);

// ─── App Root ─────────────────────────────────────────────────────────────────
const App = () => {
  const [screen, setScreen] = useState('splash');
  const [tab, setTab] = useState('scan');
  const [connectedDevice, setConnectedDevice] = useState(null);
  const [session, setSession] = useState(null);
  const [defaultBurnSeconds, setDefaultBurnSeconds] = useState(10);
  const [wipeOnDisconnect, setWipeOnDisconnect] = useState(true);
  const [panicKey, setPanicKey] = useState(0);

  // beforeunload: wipe all in-memory state
  useEffect(() => {
    const handleUnload = () => {
      setSession(null);
      setConnectedDevice(null);
    };
    window.addEventListener('beforeunload', handleUnload);
    return () => window.removeEventListener('beforeunload', handleUnload);
  }, []);

  const handleStart = () => setScreen('main');

  const handleConnect = (device) => {
    setConnectedDevice(device);
    setScreen('pairing');
  };

  const handleConnectReal = (deviceInfo) => {
    setConnectedDevice(deviceInfo);
    setScreen('pairing');
  };

  const handlePaired = (sessionData) => {
    setSession(sessionData);
    setScreen('chat');
  };

  const handleBackFromChat = () => {
    if (wipeOnDisconnect) {
      setConnectedDevice(null);
      setSession(null);
      setPanicKey(k => k + 1);
    }
    setScreen('main');
    setTab('scan');
  };

  const handlePanic = () => {
    setConnectedDevice(null);
    setSession(null);
    setPanicKey(k => k + 1);
    if (screen === 'chat') { setScreen('main'); setTab('scan'); }
  };

  if (screen === 'splash') {
    return <div className="app-shell"><SplashScreen onStart={handleStart} /></div>;
  }

  if (screen === 'pairing') {
    return (
      <div className="app-shell">
        <PairingScreen device={connectedDevice} onPaired={handlePaired} />
      </div>
    );
  }

  if (screen === 'chat') {
    return (
      <div className="app-shell">
        <ChatScreen
          key={panicKey}
          device={connectedDevice}
          defaultBurnSeconds={defaultBurnSeconds}
          session={session}
          onBack={handleBackFromChat}
        />
      </div>
    );
  }

  return (
    <div className="app-shell">
      <div className="flex-1 overflow-hidden" style={{ display: 'flex', flexDirection: 'column' }}>
        {tab === 'scan' && (
          <ScannerScreen key={panicKey} onConnect={handleConnect} onConnectReal={handleConnectReal} />
        )}
        {tab === 'chat' && (
          <div className="flex flex-col items-center justify-center flex-1 gap-4 px-6" style={{ minHeight: '80vh' }}>
            <Icon name="ghost" size={48} color="#1e1e1e" />
            <p className="text-sm text-center" style={{ color: '#333', maxWidth: 220, lineHeight: 1.7 }}>
              No active session. Scan for nearby devices to start a private chat.
            </p>
            <button className="btn-cyan px-6 py-2 rounded-xl text-xs" onClick={() => setTab('scan')}>
              Go to Scanner
            </button>
          </div>
        )}
        {tab === 'settings' && (
          <SettingsScreen
            defaultBurnSeconds={defaultBurnSeconds}
            setDefaultBurnSeconds={setDefaultBurnSeconds}
            wipeOnDisconnect={wipeOnDisconnect}
            setWipeOnDisconnect={setWipeOnDisconnect}
            onPanic={handlePanic}
            session={session}
          />
        )}
      </div>
      <NavBar tab={tab} setTab={setTab} />
    </div>
  );
};

// ─── Service Worker Registration ──────────────────────────────────────────────
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js')
      .then(reg => console.log('[Ghost] SW registered:', reg.scope))
      .catch(err => console.warn('[Ghost] SW registration failed:', err));
  });
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
